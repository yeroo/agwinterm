name: Release

# Tag a commit (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build the
# installer and publish a GitHub Release with agwinterm-setup-<ver>.exe attached.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_packages:
        description: 'Submit to winget + Chocolatey regardless of the checkpoint rule'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write        # for build-provenance attestation (free, keyless via Sigstore)
  attestations: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1

      # ---- the handover asset, carried forward -----------------------------------------------
      # agwinterm-lite left this repository, but installs that predate the handover (<= 0.17.3) still
      # look HERE for an asset whose name starts "agwinterm-lite-setup-". Stop publishing one and they
      # go silent forever: the check succeeds, matches nothing, and says nothing — no error, no notice,
      # no route to agliteterm.
      #
      # So every release re-attaches the FROZEN 0.17.4 handover build. Matching is by prefix and the
      # version comes from tag_name, not the filename, so a stale install downloads this, installs the
      # handover, and finds agliteterm on its next check. Two hops, no source tree to maintain.
      #
      # Delete this step when the pre-0.17.4 population is gone; the release then simply stops carrying
      # it, which is the same silence — by then deliberate.
      - name: Carry the frozen handover asset forward
        shell: pwsh
        run: |
          $url = 'https://github.com/${{ github.repository }}/releases/download/v0.17.4/agwinterm-lite-setup-0.17.4.exe'
          $out = 'installer/Output/agwinterm-lite-setup-0.17.4.exe'
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          # The digest a pre-handover updater verifies against is the one the release API publishes for
          # THIS asset, so the bytes must be the same ones 0.17.4 shipped. Fail loudly if they are not.
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          $want = '714ca6d2fa66da4d662764dc9eb3ae58ce45df4a4bc040a3b4ba475f02f25169'
          if ($sha -ne $want) { throw "handover asset is not the one 0.17.4 shipped: got $sha, expected $want" }
          "carried forward: agwinterm-lite-setup-0.17.4.exe ($sha)"

      - name: Build portable exe
        shell: pwsh
        run: ./installer/build-portable.ps1

      # The native core is about to become a CROSS-REPO dependency: agliteterm will build against a
      # PINNED core rather than a sibling directory (docs/plans/2026-08-17-agliteterm-product-split.md).
      # Publishing it, with a manifest naming the ABI version, is what makes that pin possible — and
      # lets a consumer verify the pairing before loading the dll instead of discovering it at fatal().
      - name: Stage native core for consumers
        shell: pwsh
        run: |
          ./tools/check-abi.ps1 -ManifestOut installer/Output/agwinterm-core-abi.json
          $abi = (Get-Content installer/Output/agwinterm-core-abi.json | ConvertFrom-Json).abiVersion
          Copy-Item native/target/release/agwinterm_core.dll     "installer/Output/agwinterm_core-abi$abi.dll"
          Copy-Item native/target/release/agwinterm-ptyhost.exe  "installer/Output/agwinterm-ptyhost-abi$abi.exe"

      # agliteterm ships from its own repository but is driven by the SAME control client — which
      # is what "speaks the agwintermctl dialect" has to mean if it is to be tested rather than
      # asserted. Its CI cannot install agwinterm to get one, so the client ships as a release
      # asset: SELF-CONTAINED single file, so the consuming repo pins no .NET version and the
      # contract is one URL rather than a runtime handshake.
      # Compressed (73 MB -> 37 MB); NOT trimmed — trimming a reflection-using JSON path to save
      # another 20 MB would be a poor trade for the tool that verifies the API contract.
      - name: Publish agwintermctl for other repositories
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'
          $v = if ($v -match '^v\d') { $v.TrimStart('v') } else { '0.0.0' }
          dotnet publish src/Agwinterm.Ctl/Agwinterm.Ctl.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=$v `
            -o ctl-publish
          Copy-Item ctl-publish/agwintermctl.exe installer/Output/agwintermctl.exe

      # Free, certless supply-chain signing: a Sigstore-backed attestation binding each artifact to
      # this commit + workflow. Verify with:  gh attestation verify <file> --repo yeroo/agwinterm
      # (Doesn't remove SmartScreen — that needs Authenticode, e.g. a SignPath Foundation OSS cert.)
      # The carried-forward handover asset is deliberately NOT in this list: this run did not build
      # those bytes, and attesting them here would claim provenance this workflow cannot vouch for.
      # Its attestation is the one v0.17.4 produced, which still verifies.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            installer/Output/agwinterm-setup-*.exe
            installer/Output/agwinterm-portable-*.exe
            installer/Output/agwintermctl.exe
            installer/Output/agwinterm_core-abi*.dll
            installer/Output/agwinterm-ptyhost-abi*.exe
            installer/Output/agwinterm-core-abi.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/agwinterm-setup-*.exe
            installer/Output/agwinterm-lite-setup-0.17.4.exe
            installer/Output/agwinterm-portable-*.exe
            installer/Output/agwintermctl.exe
            installer/Output/agwinterm_core-abi*.dll
            installer/Output/agwinterm-ptyhost-abi*.exe
            installer/Output/agwinterm-core-abi.json
          generate_release_notes: true
          fail_on_unmatched_files: true    # every one is a hard build product now — a missing one is a broken release

  # ---- checkpoint releases ----------------------------------------------------------------------
  # winget and Chocolatey are HUMAN-MODERATED. Every submission costs a reviewer a slot in a queue,
  # and this project releases far faster than those queues drain — versions started stacking up
  # behind each other, which is how 0.17.x ended up with one package version in moderation blocking
  # the next (Chocolatey answers 403 to a new version while the previous one is unreviewed).
  #
  # So only CHECKPOINT versions are submitted: a patch number that is a multiple of 9 (x.y.9,
  # x.y.18, x.y.27...). Everything between them is a GitHub release, which the in-app updater and
  # scoop both consume perfectly well — scoop's Excavator polls on a schedule and has no reviewer to
  # burden, so it deliberately stays ungated.
  #
  # The gaps are the point. If .8 does not feel like something to put in front of a reviewer, go
  # straight to .10 and let the next checkpoint be .18. The rule never forces a submission; it only
  # ever decides whether one is allowed.
  #
  # To submit anything else — a security fix, or a x.y.0 that opens a new line — run this workflow
  # manually with publish_packages: true. That override exists because the rule has one sharp edge:
  # a minor bump (0.18.0) is NOT a checkpoint, so it reaches the package managers only at 0.18.9
  # unless it is pushed by hand.
  gate:
    needs: installer
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ inputs.publish_packages }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::manual override - submitting to winget + Chocolatey"
            exit 0
          fi
          ref="${{ github.ref_name }}"
          case "$ref" in
            v*) ver="${ref#v}" ;;
            *)  echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "::notice::not a tag - no package submission"
                exit 0 ;;
          esac
          patch="${ver##*.}"
          # A non-numeric patch (a prerelease like 0.17.9-rc1) is never a checkpoint: package
          # managers should see finished versions, and "-rc1" would fail the arithmetic anyway.
          if ! [[ "$patch" =~ ^[0-9]+$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ver is a prerelease - no package submission"
            exit 0
          fi
          if [ "$patch" -gt 0 ] && [ $((patch % 9)) -eq 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ver is a checkpoint release - submitting to winget + Chocolatey"
          else
            next=$(( (patch / 9 + 1) * 9 ))
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ver is not a checkpoint (next is ${ver%.*}.$next) - GitHub release only"
          fi

  # Opens the version-bump PR to microsoft/winget-pkgs for each release. Runs as a job here
  # (not a `release:` workflow) because releases published with GITHUB_TOKEN don't trigger
  # other workflows. Needs the WINGET_TOKEN secret — a classic PAT with the public_repo
  # scope (used to fork winget-pkgs and open the PR); skips with a warning if unset.
  # The scoop bucket needs no equivalent: its Excavator updates itself on a schedule.
  winget:
    needs: [installer, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-latest
    # Best-effort: a brand-new package can't be updated until its first version clears winget-pkgs
    # moderation, so this can legitimately fail early on — don't fail the whole release for it.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Submit manifest to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Warning 'WINGET_TOKEN secret not set - skipping winget publish'; exit 0 }
          # Sync the fork FIRST. wingetcreate refuses to open a PR from a fork that has drifted
          # ("The forked repository could not be synced with the upstream commits. Sync your fork
          # manually and try again."), and upstream touches .github/workflows often enough that this
          # recurs — it blocked 0.17.3 until the fork was synced by hand. merge-upstream is
          # server-side, so it needs no checkout; the PAT carries the scope that a plain OAuth token
          # lacks. Best-effort: a fresh fork (or none yet) must not fail the release.
          $owner = '${{ github.repository_owner }}'
          try {
            $h = @{ Authorization = "token $env:WINGET_TOKEN"; 'User-Agent' = 'agwinterm-release'; Accept = 'application/vnd.github+json' }
            $r = Invoke-RestMethod -Method Post -Headers $h -Uri "https://api.github.com/repos/$owner/winget-pkgs/merge-upstream" -Body (@{ branch = 'master' } | ConvertTo-Json)
            Write-Host "fork sync: $($r.message)"
          } catch { Write-Warning "fork sync skipped: $($_.Exception.Message)" }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/agwinterm-setup-$version.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # "|x64" pins the architecture: wingetcreate sniffs the Inno stub as x86 and otherwise
          # can't match the manifest's x64 installer node (this kept winget stuck at 0.10.0).
          .\wingetcreate.exe update yeroo.agwinterm --version $version --urls "$url|x64" --submit --token $env:WINGET_TOKEN

  # Packs and pushes the Chocolatey package to the community feed on each release. Every version
  # then goes through Chocolatey's moderation queue (automated validation + VM install test +
  # human review). Needs the CHOCO_API_KEY secret (from your community.chocolatey.org account);
  # skips with a warning if unset. Rewrites version + download URL + checksum in-place from the
  # release asset so the committed template can stay pinned at the last released version.
  chocolatey:
    needs: [installer, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-latest
    # Best-effort: Chocolatey rejects new versions of a package whose first version is still in
    # moderation (403), so this can legitimately fail early on — don't fail the whole release for it.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Pack and push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if (-not $env:CHOCO_API_KEY) { Write-Warning 'CHOCO_API_KEY secret not set - skipping chocolatey publish'; exit 0 }
          # Shared with choco-push.yml (the repush-a-moderated-version path) so the two can't drift.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./packaging/chocolatey/publish.ps1 -Version $version -ApiKey $env:CHOCO_API_KEY -Repository '${{ github.repository }}'
